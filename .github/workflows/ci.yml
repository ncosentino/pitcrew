name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation_scope:
        description: 'Validation scope for this branch dispatch'
        required: false
        default: 'full'
        type: choice
        options: [full, subset]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-plan:
    name: Validation plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Resolve validation scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft || false }}
          REQUESTED_SCOPE: ${{ inputs.validation_scope || '' }}
          DRAFT_MODE: ${{ vars.CI_DRAFT_MODE || 'subset' }}
        run: |
          scope=full
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            scope="$REQUESTED_SCOPE"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$IS_DRAFT" = "true" ]; then
            scope="$DRAFT_MODE"
          fi

          case "$scope" in
            full|subset|ready-only) ;;
            *)
              echo "::error::Unsupported validation scope '$scope'."
              exit 1
              ;;
          esac

          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Validation scope: $scope"

  contracts:
    name: Runner contracts
    needs: validation-plan
    if: >-
      needs.validation-plan.outputs.scope == 'full' ||
      needs.validation-plan.outputs.scope == 'subset'
    runs-on: ubuntu-latest
    outputs:
      report_b64: ${{ steps.coverage.outputs.report_b64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = @(
            Get-ChildItem -Recurse -File -Filter '*.ps1' |
              ForEach-Object {
                $tokens = $null
                $parseErrors = $null
                [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$parseErrors) | Out-Null
                $parseErrors
              }
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Validate guidance contract
        shell: pwsh
        run: ./tests/Test-Guidance.ps1

      - name: Run runner-profile contracts
        shell: pwsh
        run: ./tests/Test-RunnerProfiles.ps1

      - name: Validate image-builder service
        shell: pwsh
        run: ./tests/Test-ImageBuilderService.ps1

      - name: Validate Copilot operations plugin
        shell: pwsh
        run: ./tests/Test-CopilotPlugin.ps1

      - name: Validate remote diagnostics
        shell: pwsh
        run: ./tests/Test-RemoteDiagnostics.ps1

      - name: Validate performance report
        shell: pwsh
        run: ./tests/Test-PerformanceReport.ps1

      - name: Validate admission snapshot
        shell: pwsh
        run: ./tests/Test-AdmissionSnapshot.ps1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: manager/autoscaler/go.mod
          cache-dependency-path: manager/autoscaler/go.sum

      - name: Validate coverage reporting
        shell: pwsh
        run: ./tests/Test-CoverageReporting.ps1

      - name: Validate coverage comment publisher
        run: node --test ./tests/Test-CoverageComment.mjs

      - name: Run admission coordinator tests
        working-directory: manager/admission
        run: |
          coverage_directory="$RUNNER_TEMP/pitcrew-coverage"
          mkdir -p "$coverage_directory"
          go test -covermode=atomic -coverprofile="$coverage_directory/admission.out" ./...
          go vet ./...

      - name: Run autoscaler tests
        working-directory: manager/autoscaler
        run: |
          coverage_directory="$RUNNER_TEMP/pitcrew-coverage"
          go test -covermode=atomic -coverprofile="$coverage_directory/autoscaler.out" ./...
          go vet ./...

      - name: Report Go coverage
        id: coverage
        shell: pwsh
        env:
          BASE_SHA: >-
            ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $coverageDirectory = Join-Path $env:RUNNER_TEMP 'pitcrew-coverage'
          $reportPath = Join-Path $coverageDirectory 'coverage.md'
          $changedArguments = @{}
          if (
            $env:BASE_SHA -and
            $env:BASE_SHA -notmatch '^0+$'
          ) {
            $changedFilesPath = Join-Path $coverageDirectory 'changed.txt'
            $changedFiles = @(
              git diff --name-only "$env:BASE_SHA...$env:HEAD_SHA" -- `
                manager/admission manager/autoscaler
            )
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to resolve changed Go files for coverage reporting.'
            }
            Set-Content `
              -LiteralPath $changedFilesPath `
              -Value $changedFiles `
              -Encoding utf8NoBOM
            $changedArguments.ChangedFilesPath = $changedFilesPath
          }

          & ./scripts/coverage/New-GoCoverageReport.ps1 `
            -ProjectRoot $PWD `
            -AdmissionProfile (
              Join-Path $coverageDirectory 'admission.out') `
            -AutoscalerProfile (
              Join-Path $coverageDirectory 'autoscaler.out') `
            -OutputPath $reportPath `
            @changedArguments

          $report = Get-Content -LiteralPath $reportPath -Raw -Encoding UTF8
          Add-Content `
            -LiteralPath $env:GITHUB_STEP_SUMMARY `
            -Value $report `
            -Encoding utf8NoBOM
          $reportBytes = [Text.Encoding]::UTF8.GetBytes($report)
          if ($reportBytes.Length -gt 49152) {
            throw 'Coverage report exceeded the bounded job-output limit.'
          }
          $encodedReport = [Convert]::ToBase64String($reportBytes)
          Add-Content `
            -LiteralPath $env:GITHUB_OUTPUT `
            -Value "report_b64=$encodedReport" `
            -Encoding utf8NoBOM

      - name: Validate manager shell syntax
        run: |
          sh -n manager/manage-runners.sh
          sh -n manager/entrypoint.sh
          sh -n manager/observability.sh
          sh -n manager/registration.sh
          sh -n manager/diagnostics.sh
          sh -n manager/host-admission.sh
          sh -n manager/host-admission-recovery.sh
          sh -n manager/container-supervision.sh
          sh -n manager/container-monitor-group-leader.sh
          sh -n manager/slot-registry.sh
          sh -n manager/reconciliation.sh
          sh -n tests/Test-ManagerReconciliation.sh
          sh -n tests/Test-HostAdmission.sh
          sh -n tests/Test-ContainerSupervision.sh
          bash -n tests/Test-ImageCandidateReport.sh
          sh -n tests/integration/fake-runner/fake-runner.sh
          bash -n profiles/image-builder/pitcrew-build-image
          bash -n tests/integration/Test-AutomationControlImage.sh
          bash -n tests/integration/Test-CapacityReconciliation.sh
          bash -n tests/integration/Test-FixedManagerAdoptionStartup.sh
          bash -n tests/integration/Test-AndroidEmulatorImage.sh
          bash -n tests/integration/Test-HostAdmissionContention.sh
          bash -n tests/integration/Test-IsolatedImageBuilder.sh

      - name: Run manager reconciliation contracts
        run: sh ./tests/Test-ManagerReconciliation.sh

      - name: Run host admission contracts
        run: sh ./tests/Test-HostAdmission.sh

      - name: Run container supervision contracts
        run: sh ./tests/Test-ContainerSupervision.sh

      - name: Run image candidate contracts
        run: bash ./tests/Test-ImageCandidateReport.sh

      - name: Validate Docker Compose configuration
        run: |
          docker compose --file docker-compose.yml config --quiet
          docker compose --file services/image-builder/docker-compose.yml config --quiet

  coverage-comment:
    name: Publish Go coverage comment
    needs: [validation-plan, contracts]
    if: >-
      needs.validation-plan.outputs.scope == 'full' &&
      needs.contracts.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Checkout coverage publisher
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/coverage/Upsert-GoCoverageComment.cjs
          sparse-checkout-cone-mode: false

      - name: Upsert coverage comment
        uses: actions/github-script@v8
        env:
          COVERAGE_REPORT_B64: ${{ needs.contracts.outputs.report_b64 }}
        with:
          script: |
            const {
              upsertCoverageComment
            } = require('./scripts/coverage/Upsert-GoCoverageComment.cjs');
            await upsertCoverageComment({
              github,
              context,
              encodedReport: process.env.COVERAGE_REPORT_B64
            });

  docker-integration:
    name: Real Docker capacity reconciliation
    needs: [validation-plan, contracts]
    if: >-
      needs.validation-plan.outputs.scope == 'full' &&
      needs.contracts.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run real Docker reconciliation
        run: bash ./tests/integration/Test-CapacityReconciliation.sh

      - name: Run host admission contention
        run: bash ./tests/integration/Test-HostAdmissionContention.sh

      - name: Run isolated image-builder integration
        run: bash ./tests/integration/Test-IsolatedImageBuilder.sh

  specialized-images:
    name: Specialized profile images
    needs: [validation-plan, contracts]
    if: >-
      needs.validation-plan.outputs.scope == 'full' &&
      needs.contracts.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and qualify Android emulator image
        run: bash ./tests/integration/Test-AndroidEmulatorImage.sh

      - name: Build and qualify automation-control image
        run: bash ./tests/integration/Test-AutomationControlImage.sh

  fixed-adoption-recovery:
    name: Fixed manager adoption recovery
    needs: [validation-plan, contracts]
    if: >-
      needs.validation-plan.outputs.scope == 'full' &&
      needs.contracts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run fixed-manager adoption recovery
        run: bash ./tests/integration/Test-FixedManagerAdoptionStartup.sh

  ci:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft CI' || 'CI' }}
    needs:
      [
        validation-plan,
        contracts,
        coverage-comment,
        docker-integration,
        specialized-images,
        fixed-adoption-recovery
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCOPE: ${{ needs.validation-plan.outputs.scope }}
      PLAN_RESULT: ${{ needs.validation-plan.result }}
      CONTRACTS_RESULT: ${{ needs.contracts.result }}
      COMMENT_RESULT: ${{ needs.coverage-comment.result }}
      DOCKER_RESULT: ${{ needs.docker-integration.result }}
      SPECIALIZED_IMAGES_RESULT: ${{ needs.specialized-images.result }}
      FIXED_ADOPTION_RESULT: ${{ needs.fixed-adoption-recovery.result }}
      EVENT_NAME: ${{ github.event_name }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check validation results
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::Validation planning failed."
            exit 1
          fi

          for result in "$CONTRACTS_RESULT" "$DOCKER_RESULT" "$SPECIALIZED_IMAGES_RESULT" "$FIXED_ADOPTION_RESULT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A required validation job failed or was cancelled."
              exit 1
            fi
          done

          case "$SCOPE" in
            full)
              if [ "$CONTRACTS_RESULT" != "success" ] ||
                 [ "$DOCKER_RESULT" != "success" ] ||
                 [ "$SPECIALIZED_IMAGES_RESULT" != "success" ] ||
                 [ "$FIXED_ADOPTION_RESULT" != "success" ]; then
                echo "::error::Full validation did not complete successfully."
                exit 1
              fi
              if [ "$EVENT_NAME" = "pull_request" ] &&
                 [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
                if [ "$COMMENT_RESULT" != "success" ]; then
                  echo "::error::Coverage comment publication did not complete successfully."
                  exit 1
                fi
              elif [ "$COMMENT_RESULT" != "skipped" ]; then
                echo "::error::Coverage comment publication ran outside a same-repository pull request."
                exit 1
              fi
              ;;
            subset)
              if [ "$CONTRACTS_RESULT" != "success" ] ||
                 [ "$COMMENT_RESULT" != "skipped" ] ||
                 [ "$DOCKER_RESULT" != "skipped" ] ||
                 [ "$SPECIALIZED_IMAGES_RESULT" != "skipped" ] ||
                 [ "$FIXED_ADOPTION_RESULT" != "skipped" ]; then
                echo "::error::Draft subset validation did not complete as planned."
                exit 1
              fi
              ;;
            ready-only)
              if [ "$CONTRACTS_RESULT" != "skipped" ] ||
                 [ "$COMMENT_RESULT" != "skipped" ] ||
                 [ "$DOCKER_RESULT" != "skipped" ] ||
                 [ "$SPECIALIZED_IMAGES_RESULT" != "skipped" ] ||
                 [ "$FIXED_ADOPTION_RESULT" != "skipped" ]; then
                echo "::error::Ready-only draft validation ran unexpected jobs."
                exit 1
              fi
              ;;
            *)
              echo "::error::Validation plan produced unsupported scope '$SCOPE'."
              exit 1
              ;;
          esac

          echo "Validation scope '$SCOPE' passed."
